<svg xmlns="http://www.w3.org/2000/svg" width="800" height="212" viewBox="0 0 800 212" role="img" aria-labelledby="title desc">
<!--
  One run of sorter_app with the four stand-in parcels in legacy-c/hw.c, as a
  25-second loop. Every moving part has its own CSS keyframes, generated from a
  timeline in seconds. People who switch animations off see one still frame:
  parcel 30123458 at the scanner.
-->
<title id="title">One run of the parcel sorter</title>
<desc id="desc">Four parcels pass the scanner on a conveyor belt. Parcel 30123458 goes into chute 3. Parcel 10123454 is read on the third try and goes into chute 1. A parcel with a damaged label cannot be read, so the sorter gives up and the parcel runs on to the end of the belt. Parcel 55123457 has no route and goes into chute 9.</desc>
<style>
svg { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-anchor: middle; }
.chute { font-size: 12px; fill: #e2e8f0; text-anchor: middle; }
.end { font-size: 12px; fill: #8b9bb3; }
.status { font-size: 11px; font-weight: 600; }
.line1 { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
.line2 { font-size: 13px; fill: #cbd5e1; }

.p1 { transform: translate(194px, 96px); }
.p2, .p3, .p4 { transform: translate(48px, 96px); }
.p3, .p4, .beam-fail, .no-read, .code2, .code4, .glow, .push1, .push3, .push9 { opacity: 0; }
.beam-ok { opacity: 0.4; }
.c2a { opacity: 0; }
.c2b { opacity: 0; }
.c3a { opacity: 0; }
.c3b { opacity: 0; }
.c4 { opacity: 0; }
.c5 { opacity: 0; }

@media (prefers-reduced-motion: no-preference) {
  .p1 { animation: p1 25s linear infinite; }
  .p2 { animation: p2 25s linear infinite; }
  .p3 { animation: p3 25s linear infinite; }
  .p4 { animation: p4 25s linear infinite; }
  .beam-ok { animation: beam-ok 25s linear infinite; }
  .beam-fail { animation: beam-fail 25s linear infinite; }
  .no-read { animation: no-read 25s linear infinite; }
  .code1 { animation: code1 25s linear infinite; }
  .code2 { animation: code2 25s linear infinite; }
  .code4 { animation: code4 25s linear infinite; }
  .glow { animation: glow 25s linear infinite; }
  .push1 { animation: push1 25s linear infinite; }
  .push3 { animation: push3 25s linear infinite; }
  .push9 { animation: push9 25s linear infinite; }
  .c1 { animation: c1 25s linear infinite; }
  .c2a { animation: c2a 25s linear infinite; }
  .c2b { animation: c2b 25s linear infinite; }
  .c3a { animation: c3a 25s linear infinite; }
  .c3b { animation: c3b 25s linear infinite; }
  .c4 { animation: c4 25s linear infinite; }
  .c5 { animation: c5 25s linear infinite; }
}
